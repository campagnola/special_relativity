<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Relativity Simulator (Step 4 – Plotting)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside>
      <h1>Special Relativity</h1>
      <div class="note">Simulator ported from <a href="https://github.com/campagnola/relativipy" target="_blank">github.com/campagnola/relativipy</a></div>
      <button id="help-btn" class="help-button">Help</button>
      <details open>
        <summary>Presets</summary>
        <div class="preset-current">
          Current: <span id="current-preset">Twin Paradox (grid)</span>
        </div>
        <div class="row">
          <label for="preset-select">Load Preset</label>
          <select id="preset-select">
            <option value="">Select preset...</option>
            <option value="Twin Paradox (grid)">Twin Paradox (grid)</option>
          </select>
        </div>
        <div class="row">
          <input id="preset-name" type="text" placeholder="Enter preset name..." title="Name for saving current configuration">
          <button id="save-preset" title="Save current configuration as preset">Save</button>
        </div>
        <div class="row">
          <button id="delete-preset" title="Delete selected user-defined preset">Delete</button>
          <button id="export-presets" title="Export all presets to file">Export</button>
          <button id="import-presets" title="Import presets from file">Import</button>
        </div>
        <input id="import-file" type="file" accept=".json" hidden>
      </details>
      <details open>
        <summary>Simulation</summary>
        <div class="row"><label for="dur">Duration</label><input id="dur" type="number" min="0.1" step="0.1" value="20.0" title="Total simulation time in arbitrary units"></div>
        <div class="row"><label for="speed">Animation Speed</label><input id="speed" type="range" min="0" max="100" value="50" title="Animation playback speed (0.01x to 100x normal speed)"><span id="speed-label">1.0x</span></div>
        <div class="row"><label for="animate">Animate</label><input id="animate" type="checkbox" checked title="Toggle real-time animation on/off"></div>
        <div class="row"><label for="time-slider">Time</label><input id="time-slider" type="range" min="0" max="10" step="0.01" value="0" title="Manually scrub through simulation time"></div>
      </details>
      <details open>
        <summary>Objects</summary>
        <div class="row">
          <button id="add-clock" title="Create a new clock object with custom acceleration program">Add Clock</button>
          <button id="add-grid" title="Create an array of synchronized clocks">Add Grid</button>
        </div>
        <div id="objects"></div>
        <div class="err" id="obj-errors" hidden></div>
      </details>
    </aside>
    <main>
      <section class="panel">
        <div class="frame-header">
          <select id="left-reference" title="Choose reference frame for left column">
            <option value="">Inertial (lab)</option>
          </select>
          <span id="left-time" class="frame-time">[ t=0.0 ]</span>
        </div>
        <canvas id="plot-left"></canvas>
        <canvas id="anim-left"></canvas>
      </section>
      <section class="panel">
        <div class="frame-header">
          <select id="right-reference" title="Choose reference frame for right column">
            <option value="">Inertial (lab)</option>
          </select>
          <span id="right-time" class="frame-time">[ t=0.0 ]</span>
        </div>
        <canvas id="plot-right"></canvas>
        <canvas id="anim-right"></canvas>
      </section>
    </main>
  </div>


  <script type="module" src="main.js"></script>
</body>
</html>
